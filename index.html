<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>У меня есть вопрос...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff0f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .screen {
            display: none;
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(255, 182, 193, 0.3);
            width: 90%;
            max-width: 380px;
            box-sizing: border-box;
            margin: 20px auto;
            position: relative; 
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #5d4037;
            font-weight: 800;
        }

        .subtitle {
            font-size: 14px;
            color: #8c7b75;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            height: 50px;
            transition: all 0.3s ease;
        }

        button {
            background-color: #ff9a9e;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 120px;
            z-index: 10;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #ff7e84;
        }

        #btnNo {
            background-color: #f5f5f5;
            color: #888;
        }

        .gif-container {
            margin-bottom: 15px;
            font-size: 65px;
        }

        .single-btn {
            width: 100%;
        }

        /* --- БАРАБАН ВЫБОРА ВРЕМЕНИ --- */
        .time-picker-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            margin: 15px auto 25px auto;
            width: 220px;
            overflow: hidden;
        }

        /* Подсветка выбранной строки по центру */
        .time-picker-highlight {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 50px;
            transform: translateY(-50%);
            background: #fff0f5;
            border: 2px solid #ffe4e1;
            border-radius: 16px;
            pointer-events: none;
            z-index: 1;
        }

        /* Градиентное затухание сверху и снизу */
        .time-picker-wrapper::before,
        .time-picker-wrapper::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 45px;
            pointer-events: none;
            z-index: 3;
        }

        .time-picker-wrapper::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0));
        }

        .time-picker-wrapper::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0));
        }

        .wheel-column {
            height: 150px;
            width: 80px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: none;
            position: relative;
            z-index: 2;
        }

        .wheel-column::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 50px;
            line-height: 50px;
            font-size: 24px;
            font-weight: 700;
            color: #c5b4ae;
            scroll-snap-align: center;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .wheel-item.active {
            color: #5d4037;
            font-size: 30px;
            font-weight: 800;
        }

        .wheel-spacer {
            height: 50px;
            pointer-events: none;
        }

        .wheel-colon {
            font-size: 28px;
            font-weight: 800;
            color: #ff9a9e;
            z-index: 2;
            padding: 0 4px 4px 4px;
        }

        /* --- СПИСОК РЕСТОРАНОВ (СЕТКА 2 КОЛОНКИ) --- */
        .restaurant-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .restaurant-card {
            display: flex;
            flex-direction: column;
            background: #fffafb;
            border: 2px solid #ffe4e1;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .restaurant-card:hover {
            border-color: #ff9a9e;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 154, 158, 0.15);
        }

        .restaurant-card:active {
            transform: scale(0.97);
        }

        .rest-thumb {
            width: 100%;
            height: 105px;
            object-fit: cover;
            background: #ffe4e1;
            display: block;
        }

        .rest-info {
            padding: 10px 8px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rest-name {
            font-size: 14px;
            font-weight: 800;
            color: #5d4037;
            margin: 0;
            line-height: 1.2;
        }

        .rest-tag {
            font-size: 11px;
            color: #8c7b75;
            margin: 0;
            line-height: 1.3;
        }

        /* --- ДЕТАЛЬНАЯ КАРТОЧКА РЕСТОРАНА --- */
        .detail-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            background: #fff0f5;
            color: #5d4037;
            width: auto;
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: #ffe4e1;
        }

        /* Слайдер фото */
        .slider-container {
            position: relative;
            width: 100%;
            height: 210px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #ffe4e1;
        }

        .slider-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            color: #5d4037;
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .slider-nav:hover {
            background: white;
        }

        .slider-prev { left: 10px; }
        .slider-next { right: 10px; }

        .slider-counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 10px;
            font-weight: bold;
        }

        .detail-desc {
            font-size: 14px;
            line-height: 1.5;
            color: #6d5b54;
            text-align: left;
            margin: 10px 0 18px 0;
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #ffe4e1;
            border-radius: 15px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fffafb;
            color: #4a4a4a;
            outline: none;
            font-family: inherit;
            resize: none;
            height: 65px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #ff9a9e;
        }

        textarea::placeholder {
            color: #bcaaa4;
        }
    </style>
</head>
<body>

    <!-- Экран 1: Вопрос -->
    <div id="screen1" class="screen active">
        <div class="gif-container">👋</div>
        <h2>Сходим куда-нибудь вместе?</h2>
        <p class="subtitle">У меня есть к тебе предложение</p>
        <div class="buttons-container">
            <button id="btnYes">Да</button>
            <button id="btnNo">Нет</button>
        </div>
    </div>

    <!-- Экран 2: Выбор времени -->
    <div id="screen2" class="screen">
        <div class="gif-container">🕰️</div>
        <h2>Во сколько встретимся?</h2>
        <p class="subtitle">Покрути, чтобы выбрать удобное время</p>

        <div class="time-picker-wrapper">
            <div class="time-picker-highlight"></div>
            <div id="hourWheel" class="wheel-column"></div>
            <div class="wheel-colon">:</div>
            <div id="minuteWheel" class="wheel-column"></div>
        </div>

        <input type="hidden" id="timeInput" value="22:00">
        <button id="btnNext" class="single-btn">Что дальше?</button>
    </div>

    <!-- Экран 3: Сетка ресторанов -->
    <div id="screen3" class="screen">
        <h2>Куда пойдем?</h2>
        <p class="subtitle">Нажми на место, чтобы посмотреть подробнее</p>
        <div id="restaurantList" class="restaurant-list"></div>
    </div>

    <!-- Экран 3.5: Детали выбранного ресторана -->
    <div id="screenDetail" class="screen">
        <div class="detail-header">
            <button id="btnBack" class="back-btn">← Назад</button>
        </div>

        <div class="slider-container">
            <img id="detailImg" class="slider-img" src="" alt="Фото ресторана">
            <button id="btnPrevPhoto" class="slider-nav slider-prev">‹</button>
            <button id="btnNextPhoto" class="slider-nav slider-next">›</button>
            <div id="photoCounter" class="slider-counter">1 / 2</div>
        </div>

        <h2 id="detailName">Название</h2>
        <p id="detailDesc" class="detail-desc">Описание</p>

        <textarea id="wishesInput" placeholder="Есть особые пожелания? (необязательно)"></textarea>

        <button id="btnSubmit" class="single-btn">Хочу сюда! ✨</button>
    </div>

    <!-- Экран 4: Финал -->
    <div id="screen4" class="screen">
        <div class="gif-container">✨</div>
        <h2>Договорились! До встречи.</h2>
        <p class="subtitle">Буду ждать!</p>
    </div>

    <script>
        // --- НАСТРОЙКИ TELEGRAM ---
        const TELEGRAM_BOT_TOKEN = '8530821460:AAG7V5vaDqzj4SW5YQws5VcyX_R4gzsRbME';
        const TELEGRAM_CHAT_ID = '836321885';

        // --- СПИСОК РЕСТОРАНОВ ---
        const restaurants = [
            {
                name: "Siesta Fiesta",
                tag: "Эстетика • Интерьер",
                description: "Место в первую очередь про вайб и красоту: приглушённый тёплый свет, дерево, два этажа и очень эстетичная атмосфера. Еда просто хорошая и понятная — без гастрономического «вау», но вкусно поужинать и красиво посидеть вдвоём самое то.",
                photos: [
                    "Rest.1.1.webp",
                    "Rest.1.2.webp"
                ]
            },
            {
                name: "Osteria Betulla",
                tag: "Италия • Вау-еда",
                description: "Интерьер тут максимально простой и минималистичный — светлые стены, дерево и ничего лишнего. Зато сюда идут именно за вкусом: еда просто разрыв, реально на уровне «вау».",
                photos: [
                    "Rest.2.1.webp",
                    "Rest.2.2.webp"
                ]
            },
            {
                name: "Хачапури и Вино",
                tag: "Грузия • Вино и уют",
                description: "Тёплое и очень уютное место с деревянным интерьером и мягким светом. Идеально, если хочется душевного вечера и реально вкусной грузинской кухни — горячие хачапури и хорошее вино.",
                photos: [
                    "Rest.3.1.webp",
                    "Rest.3.2.webp"
                ]
            },
            {
                name: "Jack and Chan",
                tag: "Азия • Вечерний вайб",
                description: "Камерное и очень атмосферное место с приглушённым тёплым светом и видом на вечернюю улицу. Отличный вариант, если хочется вкусной азиатской кухни в спокойной и стильной обстановке.",
                photos: [
                    "Rest.4.1.webp"
                ]
            },
            {
                name: "The Бык",
                tag: "Мясо • Стейки и гриль",
                description: "Стильный брутальный лофт с кирпичными стенами, живой зеленью и приглушённым светом. Идеальный вариант, если хочется максимально сытного вечера — сочные стейки, бургеры и отличное мясо без лишнего пафоса.",
                photos: [
                    "Rest.5.1.webp",
                    "Rest.5.2.webp"
                ]
            },
            {
                name: "Грис",
                tag: "Греция • Уют и закуски",
                description: "Очень тёплый и стильный интерьер с открытой кухней, медной посудой и мягким светом. Классный вариант для уютного вечера с вкусной греческой кухней — тёплые лепёшки, закуски в стол и средиземноморский вайб.",
                photos: [
                    "Rest.6.1.webp",
                    "Rest.6.2.webp"
                ]
            }
        ];

        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const screenDetail = document.getElementById('screenDetail');
        const screen4 = document.getElementById('screen4');

        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const btnNext = document.getElementById('btnNext');
        const btnBack = document.getElementById('btnBack');
        const btnSubmit = document.getElementById('btnSubmit');

        const hourWheel = document.getElementById('hourWheel');
        const minuteWheel = document.getElementById('minuteWheel');
        const timeInput = document.getElementById('timeInput');

        const restaurantListEl = document.getElementById('restaurantList');
        const detailImg = document.getElementById('detailImg');
        const detailName = document.getElementById('detailName');
        const detailDesc = document.getElementById('detailDesc');
        const photoCounter = document.getElementById('photoCounter');
        const btnPrevPhoto = document.getElementById('btnPrevPhoto');
        const btnNextPhoto = document.getElementById('btnNextPhoto');

        let currentRestaurant = null;
        let currentPhotoIndex = 0;

        // --- ЛОГИКА БАРАБАНА ВРЕМЕНИ ---
        const ITEM_HEIGHT = 50;
        const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
        const minutes = ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55'];
        let selectedHour = '22';
        let selectedMinute = '00';

        function buildWheel(container, values, onChange) {
            container.innerHTML = '';
            const topSpacer = document.createElement('div');
            topSpacer.className = 'wheel-spacer';
            container.appendChild(topSpacer);

            values.forEach((val, idx) => {
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.textContent = val;
                item.addEventListener('click', () => {
                    container.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' });
                });
                container.appendChild(item);
            });

            const bottomSpacer = document.createElement('div');
            bottomSpacer.className = 'wheel-spacer';
            container.appendChild(bottomSpacer);

            function updateActive() {
                const index = Math.round(container.scrollTop / ITEM_HEIGHT);
                const clamped = Math.max(0, Math.min(values.length - 1, index));
                const items = container.querySelectorAll('.wheel-item');
                items.forEach((el, i) => el.classList.toggle('active', i === clamped));
                onChange(values[clamped]);
            }

            container.addEventListener('scroll', updateActive);
            return updateActive;
        }

        function syncTimeInput() {
            timeInput.value = `${selectedHour}:${selectedMinute}`;
        }

        const updateHours = buildWheel(hourWheel, hours, (val) => {
            selectedHour = val;
            syncTimeInput();
        });

        const updateMinutes = buildWheel(minuteWheel, minutes, (val) => {
            selectedMinute = val;
            syncTimeInput();
        });

        // Убегающая кнопка "Нет"
        function moveButton() {
            const cardRect = screen1.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();
            
            const maxX = cardRect.width - btnRect.width - 20; 
            const maxY = cardRect.height - btnRect.height - 20;
            
            const randomX = Math.floor(Math.random() * maxX) + 10;
            const randomY = Math.floor(Math.random() * maxY) + 10;

            btnNo.style.position = 'absolute';
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });

        btnYes.addEventListener('click', () => {
            screen1.classList.remove('active');
            screen2.classList.add('active');
            // Ставим барабан на 22:00 при открытии экрана
            hourWheel.scrollTop = 22 * ITEM_HEIGHT;
            minuteWheel.scrollTop = 0;
            updateHours();
            updateMinutes();
        });

        btnNext.addEventListener('click', () => {
            screen2.classList.remove('active');
            screen3.classList.add('active');
        });

        // Генерация сетки ресторанов
        function renderRestaurants() {
            restaurantListEl.innerHTML = '';
            restaurants.forEach((rest, index) => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';
                card.innerHTML = `
                    <img class="rest-thumb" src="${rest.photos[0]}" alt="${rest.name}">
                    <div class="rest-info">
                        <div class="rest-name">${rest.name}</div>
                        <div class="rest-tag">${rest.tag}</div>
                    </div>
                `;
                card.addEventListener('click', () => openDetail(index));
                restaurantListEl.appendChild(card);
            });
        }

        // Открытие карточки ресторана
        function openDetail(index) {
            currentRestaurant = restaurants[index];
            currentPhotoIndex = 0;

            detailName.textContent = currentRestaurant.name;
            detailDesc.textContent = currentRestaurant.description;
            updateSlider();

            screen3.classList.remove('active');
            screenDetail.classList.add('active');
        }

        // Обновление фото в слайдере
        function updateSlider() {
            const photos = currentRestaurant.photos;
            detailImg.src = photos[currentPhotoIndex];
            photoCounter.textContent = `${currentPhotoIndex + 1} / ${photos.length}`;

            const showControls = photos.length > 1;
            btnPrevPhoto.style.display = showControls ? 'flex' : 'none';
            btnNextPhoto.style.display = showControls ? 'flex' : 'none';
            photoCounter.style.display = showControls ? 'block' : 'none';
        }

        btnPrevPhoto.addEventListener('click', () => {
            const total = currentRestaurant.photos.length;
            currentPhotoIndex = (currentPhotoIndex - 1 + total) % total;
            updateSlider();
        });

        btnNextPhoto.addEventListener('click', () => {
            const total = currentRestaurant.photos.length;
            currentPhotoIndex = (currentPhotoIndex + 1) % total;
            updateSlider();
        });

        // Кнопка "Назад" к списку
        btnBack.addEventListener('click', () => {
            screenDetail.classList.remove('active');
            screen3.classList.add('active');
        });

        // Отправка в Telegram
        btnSubmit.addEventListener('click', () => {
            if (!currentRestaurant) return;

            const time = timeInput.value;
            const wishes = document.getElementById('wishesInput').value.trim();
            
            let message = `Новая встреча!\nВремя: ${time}\nРесторан: ${currentRestaurant.name}`;
            if (wishes) {
                message += `\nПожелания: ${wishes}`;
            }

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}`;
            fetch(url).catch(err => console.error(err));

            screenDetail.classList.remove('active');
            screen4.classList.add('active');
        });

        renderRestaurants();
    </script>
</body>
</html>
